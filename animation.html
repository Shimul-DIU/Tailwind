<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @keyframes Football {
      0%{


        transform: rotate(0deg);
      }
      100%{
        transform: rotate(360deg);
        left: 520px;
        top:50%;
      }
      /* 100%{
         left: 80px;
        top: 50%;
        transform: rotate(0deg);
      } */

    }
    .parent{
      position: relative;
      border:4px solid black;
      height: 400px;
    }
    .img{
      position:absolute;
       left: 80px;
        top: 50%;
      border-radius: 40%;
      animation-name: Football;
      animation-timing-function:ease-in-out;
      animation-duration: 4s;
      animation-iteration-count: 1


    }


    .child{


      position:relative;
      top:40%;

    }
    #c1{
      position:absolute;
        width: 100px;
        height: 100px;
        /* border: 1px solid  black; */
        display: flex;
    }
    #c2{
        position:absolute;
        width: 100px;
        height: 100px;
        right: 0px;
        border: 1px solid  black;
        display: flex;
    }
  #goal{
      border: 1 px solid black;
      transform: rotate(90deg);

  }
  #ronaldo{
    border-radius: 50%;
  }
  </style>
</head>
<body>
  <h1>Animition example</h1>
  <div class="parent">
    <div class="child">
      <div id="c1">
        <img id="ronaldo" src="./image/ronaldo.jpg" alt="" width="100px">
      </div>
      <div id="c2">
        <img id="goal" src="./image/goalkeeper.jpg" alt="" width="100px">
      </div>
    </div>

    <img class="img" src="./image/football.jpg" alt="football imgage" height="40px">

  </div>
</body>
</html>
